apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: client
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: client
subjects:
- kind: ServiceAccount
  name: client
roleRef:
  kind: Role
  name: client
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: client
      containers:
      - name: client
        image: arp-poison:latest
        imagePullPolicy: Never
        tty: true
        command:
        - /bin/sh
        - -c
        - |
          echo "Discovering server pod IP..."
          until SERVER_IP=$(kubectl get pods -l app=server -o jsonpath='{.items[0].status.podIP}' 2>/dev/null) && [ -n "$SERVER_IP" ]; do
            sleep 2
          done
          echo "Server pod IP: $SERVER_IP"
          while true; do
            echo "Running curl"
            curl -sS --connect-timeout 2 "http://$SERVER_IP:8080/clientip"
            echo ""
            sleep 1
          done
